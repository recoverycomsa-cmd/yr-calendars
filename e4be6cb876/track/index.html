<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0097A7"><title>You Need Recovery - متابعة التمرين</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:#D6EAE2;color:#0B1F1A;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:16px 16px 60px}
header{background:linear-gradient(100deg,#0097A7 0%,#3FBF8C 50%,#76D852 100%);border-radius:0 0 32px 32px;padding:22px 20px 18px;text-align:center;margin:-16px -16px 16px}
header h1{margin:0;font-size:22px;font-weight:800}header p{margin:2px 0 0;font-size:14px}
.card{background:#fff;border:2px dotted #5BC96B;border-radius:26px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1 1 30%;padding:10px 6px;border-radius:999px;border:2px dotted #0097A7;background:#fff;font:700 14px Cairo;color:#0B1F1A}
.tabs button.on{background:linear-gradient(100deg,#0097A7,#3FBF8C,#76D852);border-style:solid;border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}.chip{width:44px;height:44px;border-radius:50%;border:2px dotted #0097A7;background:#fff;font:800 16px Cairo;color:#0B1F1A}
.chip.cur{background:#0B1F1A;color:#fff;border-style:solid}.chip.done{background:#76D852;border-style:solid;border-color:#3FBF8C}
h2{margin:0;font-size:20px;font-weight:800;color:#0A6E64}.sub{color:#35524B;font-size:14px}
.ex{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px dotted #bcd9cd;cursor:pointer}.ex:last-child{border:0}
.box{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #0097A7;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.ex.ck .box{background:linear-gradient(135deg,#0097A7,#76D852);border-color:transparent}.ex.ck .n{text-decoration:line-through;opacity:.55}
.n b{display:block;font-weight:700}.n small{color:#35524B;direction:ltr;display:block;text-align:right}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:999px;border:0;font:800 16px Cairo;color:#0B1F1A;background:linear-gradient(100deg,#0097A7,#3FBF8C,#76D852)}
.btn.o{background:#fff;border:2px dotted #0097A7;font-weight:700;font-size:14px}.btn.d{background:#0B1F1A;color:#fff}
.bar{height:12px;border-radius:99px;background:#D6EAE2;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(100deg,#0097A7,#76D852)}
.st{display:flex;gap:8px;margin-top:10px}.st div{flex:1;background:#D6EAE2;border-radius:18px;padding:8px;text-align:center;font-size:13px}.st b{display:block;font-size:20px}
.foot{font-size:12px;color:#35524B;text-align:center;margin-top:10px}.hid{display:none}
</style></head><body><div class="w" id="app"></div>
<script>
const AR={"Machine Chest Press":"جهاز صدر مستوي","hammer row":"سحب همر أفقي","Machine shoulder press":"دفع أكتاف جهاز","Leg Extension Machine":"رفرفة أرجل أمامي","Machine Biceps":"جهاز بايسبس","triceps rope":"ترايسبس حبل كيبل","Incline Chest Press":"صدر عالي جهاز","Lat pulldown":"سحب علوي واسع","DB Seated Side Raises":"كتف جانبي دمبل","Lunges":"طعن حر","Vertical leg raise":"بطن متوازي حر","Plank":"بلانك بطن","Decline Chest Press":"صدر سفلي جهاز","Machine Row":"سحب منشار جهاز","Machine Overhead Press":"كتف أمامي جهاز","Leg press":"دفش جهاز","Hammer Curls":"مطرقة بايسبس دمبل","Cable kickback triceps":"ترايسبس كيبل","Machine Chest Fly":"صدر تفتيح جهاز","Cable Seated Rows":"سحب كيبل ضيق","Machine Rear Delt Fly":"كتف خلفي جهاز","Hamstring curls":"فخذ خلفي جهاز","Machine crunches":"بطن جهاز","Traps Dumbbells":"ترابيس دمبل","Smith machine incline":"صدر عالي جهاز سميث","Lower Back Machine":"أسفل ظهر جهاز","Dumbbell Shoulder press":"كتف دمبل","Standing Calf Raise":"بطات واقف جهاز","Cable Curls":"بايسبس كيبل","Overhead DB Triceps":"ترايسبس دمبل خلفي","Incline chest machine":"جهاز صدر عالي","Decline chest machine":"جهاز صدر سفلي","Crunches machine":"جهاز بطن علوي","Pull down":"سحب علوي","Low row machine":"جهاز منشار","T-Bar machine":"جهاز ظهر علوي","Cable seated row machine":"جهاز سحب أرضي","Iso-Lateral row machine":"جهاز سحب همر","Lower back machine":"جهاز أسفل الظهر","Lateral Raise":"رفرفة كتف جانبي","Machine fly side delts":"جهاز رفرفة جانبي","Cable front raise":"كتف أمامي كيبل","Traps dumbbells":"ترابيس دمبل","Adductor machine":"جهاز العضلة الضامة","Abductor machine":"جهاز غلوتس"};
const legs=["Leg Extension Machine","Lunges","Leg press","Hamstring curls","Adductor machine","Abductor machine","Standing Calf Raise"];
const push=["دفع: صدر + أكتاف + ترايسبس",["Incline Chest Press","Machine Chest Press","Decline Chest Press","Machine shoulder press","DB Seated Side Raises","triceps rope","Overhead DB Triceps"]];
const pull=["سحب: ظهر + أكتاف خلفية + بايسبس",["Lat pulldown","Machine Row","hammer row","Machine Biceps","Hammer Curls","Cable Curls","Machine Rear Delt Fly"]];
const PR={
full:{n:"الجدول الشامل",note:"3–4 مجموعات × 10–15 تكرار · راحة 2–3 دقائق",d:[["اليوم 1",["Machine Chest Press","hammer row","Machine shoulder press","Leg Extension Machine","Machine Biceps","triceps rope"]],["اليوم 2",["Incline Chest Press","Lat pulldown","DB Seated Side Raises","Lunges","Vertical leg raise","Plank"]],["اليوم 3",["Decline Chest Press","Machine Row","Machine Overhead Press","Leg press","Hammer Curls","Cable kickback triceps"]],["اليوم 4",["Machine Chest Fly","Cable Seated Rows","Machine Rear Delt Fly","Hamstring curls","Machine crunches","Traps Dumbbells"]],["اليوم 5",["Smith machine incline","Lower Back Machine","Dumbbell Shoulder press","Standing Calf Raise","Cable Curls","Overhead DB Triceps"]]]},
split:{n:"جدول عضلة كل يوم",note:"3–4 مجموعات × 10–15 تكرار · راحة 2–3 دقائق",d:[["صدر + بطن",["Machine Chest Press","Smith machine incline","Incline chest machine","Decline chest machine","Crunches machine","Plank"]],["ظهر",["Pull down","Low row machine","T-Bar machine","Cable seated row machine","Iso-Lateral row machine","Lower back machine"]],["أكتاف + ترابيس",["Machine shoulder press","Lateral Raise","Machine fly side delts","Cable front raise","Machine Rear Delt Fly","Traps dumbbells"]],["بايسبس + ترايسبس",["Machine Biceps","Hammer Curls","Cable Curls","triceps rope","Cable kickback triceps","Overhead DB Triceps"]],["أرجل",legs]]},
ppl:{n:"جدول دفع وسحب",note:"3–4 مجموعات × 10–15 تكرار · راحة 30–60 ثانية",d:[push,pull,["أرجل",legs],push,pull]}};
const K='yr-track-v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{prog:null,p:{}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const P=()=>S.p[S.prog]||(S.p[S.prog]={cur:0,ck:{},done:{},cyc:0,rest:0,last:null,total:0});
const dt=()=>new Date().toLocaleDateString('ar',{day:'numeric',month:'long'});
const items=(k,i)=>["warm"].concat(PR[k].d[i][1]);
function nextOpen(k,from){const p=S.p[k],n=PR[k].d.length;for(let j=1;j<=n;j++){const x=(from+j)%n;if(!p.done[x])return x}return from}
function go(fn){fn();save();render()}
function render(){const a=document.getElementById('app');let h='<header><h1>You Need Recovery</h1><p>متابعة تمرينك</p></header>';
h+='<div class="card"><div class="sub" style="margin-bottom:8px">اختر جدولك</div><div class="row tabs">'+Object.keys(PR).map(k=>`<button class="${S.prog==k?'on':''}" onclick="go(()=>{S.prog='${k}'})">${PR[k].n}</button>`).join('')+'</div></div>';
if(!S.prog){a.innerHTML=h+'<p class="foot">اختر جدولك لتبدأ. يُحفظ تقدمك على جوالك تلقائياً.</p>';return}
const k=S.prog,p=P(),d=PR[k].d,n=d.length,doneN=Object.keys(p.done).length,cur=Math.min(p.cur,n-1);
h+=`<div class="card"><div class="bar"><i style="width:${Math.round(doneN/n*100)}%"></i></div><div class="st"><div><b>${doneN}/${n}</b>أيام الدورة</div><div><b>${p.cyc}</b>دورات مكتملة</div><div><b>${p.total}</b>تمرين منجز</div></div>${p.last?`<div class="sub" style="text-align:center;margin-top:8px">آخر تمرين: ${p.last}</div>`:''}</div>`;
h+='<div class="card"><div class="sub" style="text-align:center">اضغط على اليوم لتقديمه أو تأخيره</div><div class="chips">'+d.map((x,i)=>`<button class="chip ${p.done[i]?'done':''} ${i==cur?'cur':''}" onclick="go(()=>{P().cur=${i}})">${p.done[i]?'✓':i+1}</button>`).join('')+'</div></div>';
if(doneN>=n){h+=`<div class="card" style="text-align:center"><h2>🎉 أنهيت الدورة كاملة</h2><p class="sub">ممتاز! ابدأ دورة جديدة وتبدأ العلامات من جديد.</p><button class="btn" onclick="go(()=>{const q=P();q.cyc++;q.ck={};q.done={};q.cur=0})">ابدأ دورة جديدة</button></div>`}
else{const it=items(k,cur),ck=p.ck[cur]||[],all=it.every((_,j)=>ck[j]);
h+=`<div class="card"><h2>${d[cur][0]}</h2><div class="sub">${PR[k].n} · ${PR[k].note}</div><div style="margin-top:6px">`+it.map((x,j)=>`<div class="ex ${ck[j]?'ck':''}" onclick="go(()=>{const q=P();q.ck[${cur}]=q.ck[${cur}]||[];q.ck[${cur}][${j}]=!q.ck[${cur}][${j}]})"><span class="box">${ck[j]?'✓':''}</span><span class="n">${x=='warm'?'<b>إحماء 5 دقائق</b><small>Warm up</small>':`<b>${AR[x]}</b><small>${x}</small>`}</span></div>`).join('')+'</div>'+
(all?`<button class="btn" onclick="go(()=>{const q=P();q.done[${cur}]=dt();q.last=dt();q.total++;q.cur=nextOpen('${k}',${cur})})">تم إنهاء اليوم ✅</button>`:'<div class="sub" style="text-align:center;margin-top:8px">علّم كل تمرين عند إنجازه</div>')+
`<button class="btn o" onclick="go(()=>{P().cur=nextOpen('${k}',${cur})})">أجّل هذا اليوم وانتقل للتالي</button><button class="btn o" onclick="go(()=>{P().rest++})">اليوم إجازة (بدون تغيير الجدول) · ${p.rest}</button></div>`}
h+='<div class="card"><button class="btn o" onclick="bk()">نسخ احتياطي لتقدمك</button><button class="btn o" onclick="rs()">استعادة نسخة</button><button class="btn o" onclick="if(confirm(\'مسح تقدم هذا الجدول؟\'))go(()=>{delete S.p[S.prog]})">مسح تقدم هذا الجدول</button></div><p class="foot">تقدمك محفوظ على هذا الجوال فقط. أضف الصفحة للشاشة الرئيسية لتفتحها كتطبيق.</p>';
a.innerHTML=h}
function bk(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>alert('تم نسخ الرمز. احفظه في ملاحظاتك.')).catch(()=>prompt('انسخ هذا الرمز واحفظه:',c))}
function rs(){const c=prompt('الصق رمز النسخة الاحتياطية:');if(!c)return;try{S=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));save();render()}catch(e){alert('الرمز غير صحيح')}}
render();
</script></body></html>
